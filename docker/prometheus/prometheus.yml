global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Home Assistant Yellow exposes its own metrics if you enable the
  # Prometheus integration (Settings > Devices & Services > Add Integration
  # > Prometheus). Uncomment and set its IP once enabled:
  # - job_name: home-assistant
  #   bearer_token: "<long-lived access token>"
  #   static_configs:
  #     - targets: ["homeassistant.local:8123"]
